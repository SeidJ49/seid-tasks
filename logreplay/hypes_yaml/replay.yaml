root_dir: '/home/ws-ids-es3-01/Developer/Dataset/Dataset_OPV2V/validate' # your original opv2v dataset
output_dir: '/home/ws-ids-es3-01/Developer/Dataset/Dataset_OPV2V/validate_additional' # the new folder to save the dumped new data
map: # corresponding to bev map
  activate: false # whether activate HDMap module
  visualize: false # whether to visualize the BEV Map for each CAV

  save_yml: false # whether to save the map meta data in yaml files
  save_static: false # whether to dump road segmentation mask
  save_lane: false # whether to dump lane segmentation mask
  save_dynamic: false # whether to dump dynamic object BEV segmentaition mask
  save_bev_vis: false # whether to dump the BEV visualization image that has all elements
  save_bev_sem: false # whether to dump the BEV semantic mask that contains all elements

  radius: 50 # the BEV Map range, e.g., 50 means a square around the ego whose side length is 100
  raster_size: [256, 256] # the dumped BEV images resolution
  lane_sample_resolution: 0.1 # the lane keypoint sampling resolution

  static:
    draw_lane: false # whether to draw lane on the BEV visualization image
    draw_traffic_light: false # if set to true, the lanes that are influenced by traffic light will change color according to the light state, e.g., yellow, red, green
    exclude_road: false # set this to false by default
    exclude_intersection_lane: false # whether to draw the lane topology in the intersection
    z_filter_value: 6 # the road that is higher or lower relative to ego's position than the threshold won't be drawed
    other_objs: ['terrain', 'building', 'sidewalk'] # besides, lane and road, what other objects need to render on the BEV visualization image
  dynamic:
    exclude_self: true # if set to true, ego won't be drawed
    exclude_off_road: true # eclude the objects that are off road
    visibility: false # whether save visibility mask under ego coordinate. when set to true, semantic lidar has to be implemented
    visibility_corp: false # whether save visibility mask that can be seen for all cavs. when set to true, semantic lidar has to be implemented

sensor: # new attached sensor
  sensor_list:
    - name: 'RadarSensor'
      args:
        position: [2.2, 0.0, 0.7]  # Adjust as per the vehicle model, front
        rotation: [0, 0, 0]
        horizontal_fov: 120  # Field of view in degrees
        vertical_fov: 30
        points_per_second: 60000  # Number of points per second
        range: 150  # Maximum range of radar in meters
        sensor_tick: 0.0
        relative_pose: 0

    - name: 'RadarSensor'
      args:
        position: [ 2.2, -0.6, 0.7]  # Adjust as per the vehicle model, front
        rotation: [-60, 0, 0.0]
        horizontal_fov: 120  # Field of view in degrees
        vertical_fov: 30
        points_per_second: 60000  # Number of points per second
        range: 150  # Maximum range of radar in meters
        sensor_tick: 0.0
        relative_pose: 1

    - name: 'RadarSensor'
      args:
        position: [ 2.2, 0.6, 0.7]  # Adjust as per the vehicle model, front
        rotation: [ 60, 0, 0.0 ]
        horizontal_fov: 120  # Field of view in degrees
        vertical_fov: 30
        points_per_second: 60000  # Number of points per second
        range: 150  # Maximum range of radar in meters
        sensor_tick: 0.0
        relative_pose: 2

    - name: 'RadarSensor'
      args:
        position: [ -2.3, 0.0, 0.7]  # Adjust as per the vehicle model, front
        rotation: [ 180, 0, 0.0]
        horizontal_fov: 120  # Field of view in degrees
        vertical_fov: 30
        points_per_second: 60000  # Number of points per second
        range: 150  # Maximum range of radar in meters
        sensor_tick: 0.0
        relative_pose: 3

    - name: 'RadarSensor'
      args:
        position: [ 1.2, -0.7, 0.7 ]  # Adjust as per the vehicle model, front
        rotation: [ -115, 0, 0.0]
        horizontal_fov: 120  # Field of view in degrees
        vertical_fov: 30
        points_per_second: 60000  # Number of points per second
        range: 150  # Maximum range of radar in meters
        sensor_tick: 0.0
        relative_pose: 4

    - name: 'RadarSensor'
      args:
        position: [ 1.2, 0.7, 0.7]  # Adjust as per the vehicle model, front
        rotation: [ 115, 0, 0.0 ]
        horizontal_fov: 120  # Field of view in degrees
        vertical_fov: 30
        points_per_second: 60000  # Number of points per second
        range: 150  # Maximum range of radar in meters
        sensor_tick: 0.0
        relative_pose: 5


