name: opv2v_bm2cp_radar_camera
root_dir: '/home/ws-ids-es3-01/Developer/Dataset/Dataset_OPV2V/train'
validate_dir: '/home/ws-ids-es3-01/Developer/Dataset/Dataset_OPV2V/validate'

yaml_parser: "load_cross_modal_point_pillar_params"
train_params:
  batch_size: &batch_size 1
  epoches: &epoches 50
  eval_freq: 1
  save_freq: 1
  max_cav: &max_cav 5

device: &device cuda
train: &train True

wild_setting:
  seed: 20
  async: False
  async_mode: 'sim'
  async_overhead: 100
  loc_err: False
  xyz_std: 0.2
  ryp_std: 0.2
  data_size: 1.06  # Mb
  transmission_speed: 27  # Mbps
  backbone_delay: 10  # ms

dataset:
  # false = classic variant, true = rotate ego role
  duplicate_ego: false
  velocity_encoding: true # if true then we get an radar_np with ([x,y,z, v_rel_norm, v_abs_norm, v_abs_x_norm, v_abs_y_norm])

fusion:
  core_method: 'RadarCameraIntermediateFusionDatasetOPV2V_V2'  # LateFusionDataset, EarlyFusionDataset, IntermediateFusionDataset supported
  args:
    proj_first: &proj_first true
    clip_pc: false
    # core_method: 'CameraIntermediateFusionDataset' configs
    grid_conf: &grid_conf
      xbound: [-140.8, 140.8, 0.4]
      ybound: [-38.4, 38.4, 0.4]
      zbound: [-10, 10, 20.0]
      ddiscr: [2, 50, 48]
      mode: 'LID'
    data_aug_conf: &data_aug_conf
      resize_lim: [0.7, 0.8]
      final_dim: [300, 400]
      rot_lim: [0, 0] #[-3.6, 3.6]
      H: 600
      W: 800
      rand_flip: False
      bot_pct_lim: [0.0, 0.20]
      cams: ['camera0', 'camera1', 'camera2', 'camera3']
      Ncams: 4

# Preprocess-related
preprocess:
  # Options: BasePreprocessor, VoxelPreprocessor, BevPreprocessor
  core_method: 'SpVoxelPreprocessor'
  args:
    voxel_size: &voxel_size [ 0.4, 0.4, 4 ]
    max_points_per_voxel: 32
    max_voxel_train: 32000
    max_voxel_test: 70000
    num_point_features: 7 # if using veloicty otherwise 4
  # LiDAR range for each individual CAV
  cav_lidar_range: &cav_lidar [ -140.8, -38.4, -3, 140.8, 38.4, 1 ]

data_augment: [] # NEW: REMOVED DATA AUGMENT (ISSUE WITH RADAR VELOCITY)

# Anchor box related
postprocess:
  core_method: 'VoxelPostprocessor'  # VoxelPostprocessor, BevPostprocessor supported
  gt_range: *cav_lidar
  anchor_args:
    cav_lidar_range: *cav_lidar
    l: 3.9
    w: 1.6
    h: 1.56
    r: [ 0, 90 ]
    num: &achor_num 2
    feature_stride: 4
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.2
  order: 'hwl'  # hwl or lwh
  max_num: 100  # Maximum number of objects in a single frame. Use this number to make sure different frames has the same dimension in the same batch
  nms_thresh: 0.15


# Model related
model:
  core_method: point_pillar_bm2cp_radar_camera # point_pillar_bm2cp_radar_camera_no_velo

  args:
    device: *device
    train: *train
    proj_first: *proj_first
    supervise_single: False
    backbone_fix: False

    # params for camera branch
    img_params:
      grid_conf: *grid_conf
      data_aug_conf: *data_aug_conf
      img_downsample: 8
      bev_dim: 64
      use_depth_gt: false
      depth_supervision: false #true

    max_cav: *max_cav

    # params for lidar branch
    pc_params:
      voxel_size: *voxel_size
      lidar_range: *cav_lidar
      pillar_vfe:
        use_norm: True
        with_distance: False
        use_absolute_xyz: True
        use_velocity_branch: True
        num_filters: [ 64 ]
      point_pillar_scatter:
        num_features: 64

    # params for modality fusion
    modality_fusion:
      bev_backbone:
        encode_first: false
        multi_scale: true

        layer_nums: &layer_nums [3, 4, 5] #[ 3, 5, 8 ]
        layer_strides: [ 2, 2, 2 ]
        num_filters: &num_filters [ 64, 128, 256 ]
        upsample_strides: [ 1, 2, 4 ]
        num_upsample_filter: [ 128, 128, 128 ]
        voxel_size: *voxel_size

      shrink_header:
        use: true
        input_dim: 384  # 128 * 3
        dim: [ &out_channels 256 ]
        kernal_size: [ 3 ]
        stride: [ 2 ]
        padding: [ 1 ]

      compression: 0  # Compression rate

    # params for collaborative fusion: where2comm
    collaborative_fusion:
      fully: False
      voxel_size: *voxel_size
      downsample_rate: 1
      in_channels: *out_channels

      communication:
        round: 1
        #threshold: 0.01
        #gaussian_smooth:
        #  k_size: 5
        #  c_sigma: 1.0
      agg_operator:
        mode: 'ATTEN'
        feature_dim: *out_channels
      multi_scale: True
      layer_nums: *layer_nums
      num_filters: *num_filters


    # params for prediction
    head_dim: 256
    outC: *out_channels
    anchor_number: *achor_num

loss:
  core_method: point_pillar_loss
  args:
    cls_weight: 1.0
    reg: 2.0

optimizer:
  core_method: Adam
  lr: 0.001
  args:
    eps: 1e-8
    weight_decay: 1e-4

lr_scheduler:
  core_method: multistep #step, multistep and Exponential support
  gamma: 0.1
  step_size: [10, 15]
