name: second_resnet_reliability_fusion

root_dir: "/home/ws-ids-es3-01/PycharmProjects/Datasets/DatasetTruckscences_big/trainval/train.pkl"
validate_dir: "/home/ws-ids-es3-01/PycharmProjects/Datasets/DatasetTruckscences_big/trainval/val.pkl"
test_dir: "/home/ws-ids-es3-01/PycharmProjects/Datasets/DatasetTruckscences_big/trainval/test.pkl"

ref_frame: 'ego_pose'

yaml_parser: "load_second_thesis_params"
train_params:
  batch_size: &batch_size 4
  epoches: 50
  eval_freq: 1
  save_freq: 1

# WP4 needs both sensors: LiDAR for geometric reliability, radar as robust fallback.
input_source: ['lidar']
label_type: 'lidar'

only_vis_ego: true

fusion:
  core_method: 'SingleDatasetLidarRadarBaseline'
  dataset: 'v2xsim'
  args: []

preprocess:
  core_method: 'SpVoxelPreprocessor'
  args:
    voxel_size: &voxel_size [0.4, 0.4, 0.2]
    max_points_per_voxel: 32
    max_voxel_train: 32000
    max_voxel_test: 70000
    lidar_num_point_features: 4

    radar_max_points_per_voxel: 8
    radar_max_voxel_train: 12000
    radar_max_voxel_test: 20000
    radar_num_point_features: 4
  cav_lidar_range: &cav_lidar [-51.2, -51.2, -5.0, 51.2, 51.2, 3.0]

data_augment: []

postprocess:
  core_method: 'VoxelPostprocessor'
  gt_range: *cav_lidar
  anchor_args:
    cav_lidar_range: *cav_lidar
    l: 3.9
    w: 1.6
    h: 1.56
    r: &anchor_yaw [0, 90]
    feature_stride: 8
    num: &anchor_num 2
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.20
  order: 'hwl'
  max_num: 100
  nms_thresh: 0.15
  dir_args: &dir_args
    dir_offset: 0.7853
    num_bins: 2
    anchor_yaw: *anchor_yaw

model:
  core_method: second_reliability_fusion
  args:
    batch_size: *batch_size
    voxel_size: *voxel_size
    lidar_range: *cav_lidar
    num_point_features: 4
    radar_num_point_features: 4
    anchor_number: *anchor_num
    dir_args: *dir_args

    bev_backbone_type: resnet

    mean_vfe: {}
    backbone_3d: {}
    height_compression:
      feature_num: 256
    base_bev_backbone:
      layer_nums: [5, 5]
      layer_strides: [1, 2]
      num_filters: [128, 256]
      upsample_strides: [1, 2]
      num_upsample_filter: [256, 256]
      inplanes: 256

    reliability:
      mode: heuristic
      pool_kernel: 5
      density_weight: 0.7
      distance_weight: 0.3

    fusion_gate:
      hidden_channels: 128

loss:
  core_method: point_pillar_loss
  args:
    pos_cls_weight: 1.0
    cls:
      type: 'SigmoidFocalLoss'
      alpha: 0.25
      gamma: 2.0
      weight: 1.0
    reg:
      type: 'WeightedSmoothL1Loss'
      sigma: 3.0
      codewise: true
      weight: 2.0
    dir:
      type: 'WeightedSoftmaxClassificationLoss'
      weight: 0.2
      args: *dir_args

optimizer:
  core_method: Adam
  lr: 0.002
  args:
    eps: 1e-10
    weight_decay: 1e-4

lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size: [10, 20]
